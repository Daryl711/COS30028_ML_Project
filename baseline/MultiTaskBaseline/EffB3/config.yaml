# EfficientNet-B3 baseline on DPD-Small.
# Everything matches the B0 baseline (configs/baseline.yaml) except the lines marked "changed".
# mode: multitask -> one backbone, crop head + disease head (Fig. 1 right)
#       crop      -> crop-only model     } run both for the independent
#       disease   -> disease-only model  } baseline (Fig. 1 left)
experiment: multitask_effb3        # changed
mode: multitask
seed: 42
output_dir: outputs

data:
  root: dataset
  image_dir: DPD_Small_dataset
  train_csv: DPD_Small_train.csv
  test_seen_csv: DPD_Small_test_seen.csv
  test_unseen_csv: DPD_Small_test_unseen.csv
  val_fraction: 0.1
  img_size: 300                    # changed: B3's native resolution (B0 used 224)
  num_workers: 4

model:
  backbone: efficientnet_b3.ra2_in1k   # changed: ImageNet-1k weights, same recipe family as B0
  pretrained: true
  dropout: 0.3
  drop_path_rate: 0.2

train:
  epochs: 30
  batch_size: 32                   # changed: 64 at 300 px needs ~9.6 GB; 32 needs ~4.9 GB ...
  accum_steps: 2                   # ... so 32 x 2 keeps the effective batch at 64, same as B0
  lr_backbone: 2.0e-4
  lr_head: 1.0e-3
  weight_decay: 1.0e-2
  warmup_epochs: 2
  label_smoothing: 0.1
  loss_weights:
    crop: 1.0
    disease: 1.0
  amp: true
  grad_clip: 0.0                   # off, as in B0
  patience: 8
