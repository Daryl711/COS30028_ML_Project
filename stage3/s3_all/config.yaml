# Stage 3, run All (R4 + R5 + R6): learnable prompts + separate adapters + conditional crop-invariance GRL.
# Every value below is training_scheme.md §1-§5, identical to the other Stage 3 runs. The "R4" / "R5" / "R6"
# lines are those runs' method settings, unchanged (training_scheme.md §6.1). R8a logit adjustment is off.
experiment: s3_all
seed: 42
output_dir: outputs

data:
  root: dataset
  image_dir: DPD_Small_dataset
  train_csv: DPD_Small_train.csv
  test_seen_csv: DPD_Small_test_seen.csv
  test_unseen_csv: DPD_Small_test_unseen.csv
  text_dir: text
  val_fraction: 0.1
  img_size: 224
  num_workers: 4

model:
  backbone: hf-hub:imageomics/bioclip
  head_dropout: 0.3
  n_ctx: 4                              # R4: CoOp context length M
  attr_dropout: 0.3                     # R4: CSP attribute dropout on the class-name tokens
  bottleneck_dim: 256                   # R5: A_c, A_d are 512 -> 256 -> 512
  adapter_dropout: 0.1                  # R5
  disc_hidden: 256                      # R6: discriminator 512 -> 256 -> 55

r4:
  lambda_kg: 8.0                        # R4: KgCoOp anchor weight

r6:
  lambda_max: 0.1                       # R6: GRL strength, DANN ramp
  conditional: true                     # R6: softmax over C(d), diseases on >= 2 crops only; false = plain DANN

train:
  epochs: 30
  batch_size: 64
  warmup_epochs: 2
  min_lr_ratio: 0.01
  lr_new: 1.0e-3                        # every new module (guide.md)
  lr_prompt: null                       # prompt tokens; null = lr_new. Set only if the R4 LR sweep adopts one
  weight_decay: 5.0e-2
  label_smoothing: 0.1                  # classification heads only; L_kg and L_inv are unsmoothed
  grad_clip: 1.0
  patience: 8
  amp: true
