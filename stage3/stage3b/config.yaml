# Stage 3, run R5: 2b (frozen BioCLIP + taxonomy-text cosine heads) + separate adapters A_c, A_d.
# Every value below is training_scheme.md §1-§5. The "R5" lines are the only method-specific
# settings (training_scheme.md §6.1). R8a logit adjustment is off (Stage 2 decision, results.md).
experiment: s3_r5
seed: 42
output_dir: outputs

data:
  root: dataset
  image_dir: DPD_Small_dataset          # original resolution, not DPD_Small_256
  train_csv: DPD_Small_train.csv
  test_seen_csv: DPD_Small_test_seen.csv
  test_unseen_csv: DPD_Small_test_unseen.csv
  text_dir: text                        # plant_descriptions.csv, diseases_descriptions.csv (DPD taxonomy)
  val_fraction: 0.1
  img_size: 224
  num_workers: 4

model:
  backbone: hf-hub:imageomics/bioclip   # BioCLIP ViT-B/16, image and text encoders frozen
  head_dropout: 0.3
  bottleneck_dim: 256                   # R5: A_c, A_d are 512 -> 256 -> 512
  adapter_dropout: 0.1                  # R5: dropout inside each adapter
  # logit scale: BioCLIP's pretrained value, fixed (read from the model, not configurable)

train:
  epochs: 30
  batch_size: 64
  warmup_epochs: 2
  min_lr_ratio: 0.01
  lr_new: 1.0e-3                        # text classifiers and adapters
  weight_decay: 5.0e-2
  label_smoothing: 0.1
  grad_clip: 1.0
  patience: 8
  amp: true
