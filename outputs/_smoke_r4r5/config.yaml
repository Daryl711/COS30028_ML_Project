experiment: _smoke_r4r5
seed: 42
output_dir: outputs
data:
  root: dataset
  image_dir: DPD_Small_dataset
  train_csv: DPD_Small_train.csv
  test_seen_csv: DPD_Small_test_seen.csv
  test_unseen_csv: DPD_Small_test_unseen.csv
  text_dir: text
  val_fraction: 0.1
  img_size: 224
  num_workers: 4
model:
  backbone: hf-hub:imageomics/bioclip
  head_dropout: 0.3
  n_ctx: 4
  attr_dropout: 0.3
  bottleneck_dim: 256
  adapter_dropout: 0.1
r4:
  lambda_kg: 8.0
train:
  epochs: 1
  batch_size: 64
  warmup_epochs: 2
  min_lr_ratio: 0.01
  lr_new: 0.001
  lr_prompt: null
  weight_decay: 0.05
  label_smoothing: 0.1
  grad_clip: 1.0
  patience: 8
  amp: true
