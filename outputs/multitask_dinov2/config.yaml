experiment: multitask_dinov2
mode: multitask
seed: 42
output_dir: outputs
data:
  root: dataset
  image_dir: DPD_Small_dataset
  train_csv: DPD_Small_train.csv
  test_seen_csv: DPD_Small_test_seen.csv
  test_unseen_csv: DPD_Small_test_unseen.csv
  val_fraction: 0.1
  img_size: 224
  num_workers: 4
model:
  backbone: vit_small_patch14_dinov2.lvd142m
  pretrained: true
  dropout: 0.3
  drop_path_rate: 0.1
train:
  epochs: 30
  batch_size: 32
  accum_steps: 2
  lr_backbone: 5.0e-05
  layer_decay: 0.75
  lr_head: 0.001
  weight_decay: 0.05
  warmup_epochs: 2
  label_smoothing: 0.1
  loss_weights:
    crop: 1.0
    disease: 1.0
  amp: true
  grad_clip: 1.0
  patience: 8
