# EfficientNet-B0 baseline on DPD-Small, following the training scheme (Stage 1).
# Scheme settings for both Stage 1 runs (training_scheme.md).
# mode: multitask -> one backbone, crop head + disease head (Stage 1a)
#       crop      -> crop-only model     } run both for the independent
#       disease   -> disease-only model  } baseline (Stage 1b)
experiment: stage1a
mode: multitask
seed: 42
output_dir: outputs

data:
  root: dataset
  image_dir: DPD_Small_dataset
  train_csv: DPD_Small_train.csv
  test_seen_csv: DPD_Small_test_seen.csv
  test_unseen_csv: DPD_Small_test_unseen.csv
  val_fraction: 0.1                # held out from train, per composition, for model selection
  img_size: 224
  num_workers: 4

model:
  backbone: efficientnet_b0
  pretrained: true
  dropout: 0.3
  drop_path_rate: 0.2

train:
  epochs: 30
  batch_size: 64
  accum_steps: 1                   # batch 64 fits on 6 GB at 224 px, so no accumulation
  lr_backbone: 2.0e-4
  lr_head: 1.0e-3
  weight_decay: 5.0e-2
  warmup_epochs: 2
  label_smoothing: 0.1
  loss_weights:
    crop: 1.0
    disease: 1.0
  amp: true
  grad_clip: 1.0                   # clip global grad norm to 1.0
  patience: 8                      # early stopping on val score; 0 disables
